# Experiment sweep configuration.
# Each key defines the range of values to iterate over for "Run Experiment Batch".
# Fixed values are single-element lists (or bare scalars for clarity).
# The Cartesian product of all lists forms the full set of experiment points.

seeds: [1]

# Algorithm selection — all available algorithms
algorithms:

  - dijkstra
  - a_star
  - weighted_a_star
  - dynamic_programming
  - q_learning

# Environment sizes — small (10×5), medium (40×20), large (80×40)
env_sizes:
  - small
  - medium
  - large

# Flow direction: "up" (bottom→top, vj=+1) and/or "down" (top→bottom, vj=-1)
flow_directions:
  - up
  - down

# Flow strength (vector magnitude).  Range 0.0 – 1.0 in steps of 0.5.
flow_strengths: 1.0

# Gaussian sigma values (grid cells).  Only used when flow_type == "gaussian".
# Range 1.0 – 10.0 in steps of 1.0.
sigmas: [5.0, 10.0]

# Gaussian floor fraction — fixed at 10 %
floor: [0.10]

# Cost-function weights — fixed
alpha: 1.0
beta: 1.0

# Inertia values (heading-history depth)
inertias: [0, 1]

# Q-learning episodes — three options
ql_episodes: [200, 500, 1500]

# Turn penalty — fixed
turn_penalty: 1.0

# Grid dimensions derived from env_sizes; not used directly in sweep loops.
