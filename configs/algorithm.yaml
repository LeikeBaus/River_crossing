common:
  alpha: 1.0 # weight for time cost
  beta: 0.0 # weifght for energy cost

dijkstra: {}

a_star:
  heuristic: euclidean # heuristic function for A* algorithm

weighted_a_star:
  heuristic: euclidean # heuristic function for weighted A* algorithm
  weight: 1.5 # weight for the heuristic function

dynamic_programming:
  gamma: 1.0 # discount factor for dynamic programming
  tolerance: 1.0e-6 # convergence tolerance
  max_iterations: 10000 # maximum number of iterations

apf:
  k_att: 1.0 # attractive force gain
  lambda_flow: 0.2 # flow field influence

q_learning:
  learning_rate: 0.1 # learning rate for Q-learning
  gamma: 0.99 # discount factor for Q-learning
  epsilon_start: 1.0 # initial exploration rate
  epsilon_end: 0.02 # final exploration rate
  epsilon_decay: 0.998 # decay rate for exploration
  goal_reward: 25.0 # reward for a successful docking
  progress_reward_scale: 1.5 # bonus for moving toward the docking corridor
  revisit_penalty: 0.5 # penalty for revisiting states
  approach_bonus: 2.5 # bonus for reaching a valid pre-docking state