flow:
  type: gaussian
  vector: [0.0, 1.0]  # flow direction: (0, +1) = bottom→top
  sigma: 5.0           # Gaussian width in grid cells
  floor: 0.1           # minimum flow fraction at the shore edges

docking:
  normal: [0.0, 1.0]
  approach_angle_deg:
    min: 30.0
    max: 60.0

# Default size: large
grid:
  nx: 80
  ny: 40
start: [2, 6]
goal: [77, 35]

# Named size variants — only grid/start/goal differ; flow and docking are shared.
sizes:
  small:
    grid: {nx: 10, ny: 5}
    start: [1, 1]
    goal: [8, 3]
  medium:
    grid: {nx: 40, ny: 20}
    start: [2, 5]
    goal: [37, 15]
  large:
    grid: {nx: 80, ny: 40}
    start: [2, 6]
    goal: [77, 35]
