grid:
  nx: 40
  ny: 20

flow:
  type: gaussian
  vector: [0.0, 1.0] # flow direction: (0, +1) = bottom→top
  sigma: 5.0          # Gaussian width in grid cells
  floor: 0.1          # minimum flow fraction at the shore edges

start: [2, 5]
goal: [37, 15]

docking:
  normal: [0.0, 1.0]
  approach_angle_deg:
    min: 30.0
    max: 60.0
